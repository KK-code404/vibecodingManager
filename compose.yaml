name: vibecoding-manager
services:
  control-center:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:5176:8080"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set the HTTPS control center origin}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - control-data:/app/data
      - ./data/ssh:/run/secrets/ssh:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
volumes:
  control-data:
